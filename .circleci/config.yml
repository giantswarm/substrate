# Fork (giantswarm/substrate): publishes the Giant Swarm line of Agent
# Substrate to gsoci.azurecr.io/giantswarm/substrate through the architect
# orb — every push to `giantswarm` as a dev build, every release tag `vX.Y.Z`
# (or `-rc.N`) as the release `X.Y.Z` (FORK.md, "Publishing"). The six images
# the agent platform runs (ateapi, atecontroller, atelet, atenet,
# podcertcontroller, ateom-gvisor) are one architect/push-to-registries job
# each: built from .circleci/Dockerfile for linux/amd64 and linux/arm64,
# signed with the organisation's CircleCI identity, with provenance and an
# SBOM, the index annotated with the upstream pin. The version is the orb's
# (gitsemver, from the git tags) — nothing here computes one. Every own image
# is scanned before the charts that reference it are pushed: substrate-crds
# and substrate with their image defaults stamped to this registry, including
# the agentgateway image atenet-router and atenet-egress run, which comes from
# the Giant Swarm line of agentgateway (pinned below) instead of upstream's
# build. Every other branch builds the six images without pushing, so a
# Dockerfile regression surfaces on the pull request. Hand-written: the
# repository carries upstream's workflows and its own, nothing
# devctl-generated.
version: 2.1

orbs:
  architect: giantswarm/architect@10.10.0

parameters:
  agentgateway-image:
    description: >
      The agentgateway build atenet-router and atenet-egress run: a release of
      the Giant Swarm line of agentgateway (FORK.md, "Publishing"), stamped into
      the chart's images.agentgateway at package time and scanned with the own
      images. Moves only together with the chart default, and only with the pin
      (FORK.md, "Re-pin"); never bumped by Renovate on its own.
    type: string
    default: gsoci.azurecr.io/giantswarm/agentgateway-upstream/agentgateway:2.2.0

jobs:
  scan:
    executor: architect/architect
    resource_class: small
    # The line's registry path: images at REGISTRY/<component>, charts at
    # oci://REGISTRY/helm. The version is the one the push jobs computed
    # (.build_version, from the workspace).
    environment: &publish-environment
      REGISTRY: gsoci.azurecr.io/giantswarm/substrate
      COMPONENTS: ateapi atecontroller atelet atenet podcertcontroller ateom-gvisor kubernetes-secrets
      AGENTGATEWAY_IMAGE: << pipeline.parameters.agentgateway-image >>
      TRIVY_IMAGE: gsoci.azurecr.io/giantswarm/trivy:0.74.0
      # The trivy database mirrors, tried in order (ghcr rate-limits anonymous pulls).
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Scan every image
          # Own images gate the charts: a fixable HIGH or CRITICAL finding
          # fails the publish (fix it — bump the module, or time-box it in
          # .trivyignore with an expiry when upstream has no fix). The
          # agentgateway image is the Giant Swarm line's build and reports
          # only here: its scan gates its own publish in
          # giantswarm/agentgateway-upstream, and a finding is fixed there.
          # Trivy runs from its image on the remote docker engine, one
          # container per image sharing one database cache; a bind mount does
          # not reach a remote engine, so .trivyignore is copied in.
          # image-refs.txt (`<name> <repository>@<digest>`) records what was
          # scanned, by digest, as the run's artifact.
          no_output_timeout: 20m
          command: |
            set -o errexit -o nounset -o pipefail
            VERSION=$(cat .build_version)
            refs=""
            for component in ${COMPONENTS}; do
              refs="${refs} ${component}=${REGISTRY}/${component}:${VERSION}"
            done
            refs="${refs} agentgateway=${AGENTGATEWAY_IMAGE}"
            : > image-refs.txt
            failed=0
            for entry in ${refs}; do
              name="${entry%%=*}"
              ref="${entry#*=}"
              digest=$(oras manifest fetch --descriptor "${ref}" | jq -r '.digest')
              echo "${name} ${ref%:*}@${digest}" >> image-refs.txt
              if [ "${name}" = agentgateway ]; then exit_code=0; else exit_code=1; fi
              echo "==> ${name}: ${ref} (${digest})"
              docker create --name "trivy-${name}" \
                -e TRIVY_DB_REPOSITORY -e TRIVY_CACHE_DIR=/cache -v trivy-cache:/cache \
                "${TRIVY_IMAGE}" image --severity CRITICAL,HIGH --ignore-unfixed \
                --ignorefile /.trivyignore --exit-code "${exit_code}" --format table "${ref}" > /dev/null
              docker cp .trivyignore "trivy-${name}:/.trivyignore"
              if ! docker start --attach "trivy-${name}"; then
                echo "ERROR: ${name} carries a fixable HIGH or CRITICAL finding" >&2
                failed=1
              fi
            done
            echo "Images ${VERSION}"
            cat image-refs.txt
            exit "${failed}"
      - store_artifacts:
          path: image-refs.txt

  charts:
    executor: architect/architect
    resource_class: small
    environment: *publish-environment
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Stamp, package and push the charts
          # The chart's image defaults are stamped to this registry and version
          # (image.tag explicitly, although the helper falls back to
          # .Chart.AppVersion: `helm show values` is documentation); the checks
          # make a missed anchor fail the job instead of shipping upstream's
          # defaults. The chart version is the artifact version, as upstream
          # does. chart-refs.txt: `<chart> <repository>@<digest>`, staged for
          # signing.
          command: |
            set -o errexit -o nounset -o pipefail
            VERSION=$(cat .build_version)
            values=charts/substrate/values.yaml
            # The agentgateway stamp anchors on the key, not on upstream's value:
            # upstream moves that value between pins.
            test "$(grep -c '^  agentgateway: ' "${values}")" = 1
            # The chart default must already be the pinned build: the egress config
            # is written for its schema, and helm-e2e installs the unstamped chart.
            if [ "$(sed -n 's/^  agentgateway: //p' "${values}")" != "${AGENTGATEWAY_IMAGE}" ]; then
              echo "ERROR: ${values} images.agentgateway differs from the agentgateway-image parameter (${AGENTGATEWAY_IMAGE}); move both together" >&2
              exit 1
            fi
            # image.registry is the host and image.repository the path (the
            # chart's registry/repository split); the component name follows.
            sed -i \
              -e "s|^  registry: ghcr.io$|  registry: ${REGISTRY%%/*}|" \
              -e "s|^  repository: kagent-dev/substrate$|  repository: ${REGISTRY#*/}|" \
              -e "s|^  tag: \"\"$|  tag: \"${VERSION}\"|" \
              -e "s|^  agentgateway: .*$|  agentgateway: ${AGENTGATEWAY_IMAGE}|" \
              "${values}"
            grep -q "^  registry: ${REGISTRY%%/*}$" "${values}"
            grep -q "^  repository: ${REGISTRY#*/}$" "${values}"
            grep -q "^  tag: \"${VERSION}\"$" "${values}"
            grep -q "^  agentgateway: ${AGENTGATEWAY_IMAGE}$" "${values}"
            if grep -n "kagent-dev/substrate" "${values}"; then
              echo "ERROR: ${values} still references upstream's registry after stamping" >&2
              exit 1
            fi

            mkdir -p dist
            for chart in substrate-crds substrate; do
              helm package "charts/${chart}" --destination dist --version "${VERSION}" --app-version "${VERSION}"
            done

            printf '%s' "${ACR_GSOCI_PASSWORD}" | helm registry login gsoci.azurecr.io --username "${ACR_GSOCI_USERNAME}" --password-stdin
            # cosign reads ~/.docker/config.json, not helm's registry config.
            mkdir -p ~/.docker
            auth=$(printf '%s:%s' "${ACR_GSOCI_USERNAME}" "${ACR_GSOCI_PASSWORD}" | base64 -w0)
            printf '{"auths":{"gsoci.azurecr.io":{"auth":"%s"}}}' "${auth}" > ~/.docker/config.json
            chmod 600 ~/.docker/config.json

            : > chart-refs.txt
            : > /tmp/.cosign_refs
            for chart in substrate-crds substrate; do
              out=$(helm push "dist/${chart}-${VERSION}.tgz" "oci://${REGISTRY}/helm" 2>&1)
              echo "${out}"
              digest=$(printf '%s\n' "${out}" | sed -n 's/^Digest: //p')
              test -n "${digest}"
              echo "${chart} ${REGISTRY}/helm/${chart}@${digest}" >> chart-refs.txt
              echo "${REGISTRY}/helm/${chart}@${digest}" >> /tmp/.cosign_refs
            done
            echo "Charts ${VERSION}"
            cat chart-refs.txt
      - architect/cosign-sign-verify
      - store_artifacts:
          path: chart-refs.txt

workflows:
  # The line's branch and its release tags: build, push, scan, then the charts.
  # Exactly one push job persists the version to the workspace (CircleCI refuses
  # to attach a path two concurrent jobs persisted); the other five run with
  # persist-build-version false.
  publish:
    jobs:
      - architect/push-to-registries: &publish-push
          name: push-ateapi
          context: architect
          image: giantswarm/substrate/ateapi
          build-args: COMPONENT=ateapi
          persist-build-version: true
          dockerfile: .circleci/Dockerfile
          platforms: linux/amd64,linux/arm64
          resource_class: large
          registries-data: public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD true
          # The upstream release this line is built from (FORK.md, "Pin"); moved with the pin.
          annotations: index:io.giantswarm.upstream.version=v0.2.0-beta5
          filters: &publish-filters
            branches:
              only: giantswarm
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
      - architect/push-to-registries:
          <<: *publish-push
          name: push-atecontroller
          image: giantswarm/substrate/atecontroller
          build-args: COMPONENT=atecontroller
          persist-build-version: false
      - architect/push-to-registries:
          <<: *publish-push
          name: push-atelet
          image: giantswarm/substrate/atelet
          build-args: COMPONENT=atelet
          persist-build-version: false
      - architect/push-to-registries:
          <<: *publish-push
          name: push-atenet
          image: giantswarm/substrate/atenet
          build-args: COMPONENT=atenet
          persist-build-version: false
      - architect/push-to-registries:
          <<: *publish-push
          name: push-podcertcontroller
          image: giantswarm/substrate/podcertcontroller
          build-args: COMPONENT=podcertcontroller
          persist-build-version: false
      - architect/push-to-registries:
          <<: *publish-push
          name: push-ateom-gvisor
          image: giantswarm/substrate/ateom-gvisor
          build-args: COMPONENT=ateom-gvisor
          persist-build-version: false
      - architect/push-to-registries:
          <<: *publish-push
          name: push-kubernetes-secrets
          image: giantswarm/substrate/kubernetes-secrets
          # The credential provider the egress gateway injects Secret-backed
          # credentials from; its source lives one directory deeper than the
          # binary's name.
          build-args: |
            COMPONENT=kubernetes-secrets
            COMPONENT_PATH=credential-provider/kubernetes-secrets
          persist-build-version: false
      - scan:
          requires:
            - push-ateapi
            - push-atecontroller
            - push-atelet
            - push-atenet
            - push-podcertcontroller
            - push-ateom-gvisor
            - push-kubernetes-secrets
          filters: *publish-filters
      - charts:
          context: architect
          requires:
            - scan
          filters: *publish-filters

  # Every other branch: the same six builds for both platforms, nothing pushed.
  validate:
    jobs:
      - architect/push-to-registries: &validate-push
          name: build-ateapi
          image: giantswarm/substrate/ateapi
          build-args: COMPONENT=ateapi
          push: false
          persist-build-version: true
          dockerfile: .circleci/Dockerfile
          platforms: linux/amd64,linux/arm64
          resource_class: large
          annotations: index:io.giantswarm.upstream.version=v0.2.0-beta5
          filters: &validate-filters
            branches:
              ignore: giantswarm
      - architect/push-to-registries:
          <<: *validate-push
          name: build-atecontroller
          image: giantswarm/substrate/atecontroller
          build-args: COMPONENT=atecontroller
          persist-build-version: false
      - architect/push-to-registries:
          <<: *validate-push
          name: build-atelet
          image: giantswarm/substrate/atelet
          build-args: COMPONENT=atelet
          persist-build-version: false
      - architect/push-to-registries:
          <<: *validate-push
          name: build-atenet
          image: giantswarm/substrate/atenet
          build-args: COMPONENT=atenet
          persist-build-version: false
      - architect/push-to-registries:
          <<: *validate-push
          name: build-podcertcontroller
          image: giantswarm/substrate/podcertcontroller
          build-args: COMPONENT=podcertcontroller
          persist-build-version: false
      - architect/push-to-registries:
          <<: *validate-push
          name: build-ateom-gvisor
          image: giantswarm/substrate/ateom-gvisor
          build-args: COMPONENT=ateom-gvisor
          persist-build-version: false
      - architect/push-to-registries:
          <<: *validate-push
          name: build-kubernetes-secrets
          image: giantswarm/substrate/kubernetes-secrets
          build-args: |
            COMPONENT=kubernetes-secrets
            COMPONENT_PATH=credential-provider/kubernetes-secrets
          persist-build-version: false
