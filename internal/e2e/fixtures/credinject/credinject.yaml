# The egress credential-injection fixture: the Secret the suite's policy
# injects. e2e.ConfigureCredentialProvider applies it and adds the grants that
# let the probe fixture's atespaces resolve it to the provider's installed
# authorization policy.

apiVersion: v1
kind: Namespace
metadata:
  name: ate-e2e-credinject-secrets
  labels:
    # Lets hack/cleanup-e2e.sh find and delete this namespace when a failed
    # test leaves the fixture behind for debugging.
    ate.dev/e2e: "true"

---

# The credential the suite's EgressPolicy injects, resolved by the URI
# ate-secret://k8s.io/default/ate-e2e-credinject-secrets/api-token/token
# (see e2e.CredentialInjectionURI).
apiVersion: v1
kind: Secret
metadata:
  name: api-token
  namespace: ate-e2e-credinject-secrets
type: Opaque
stringData:
  token: "e2e-cred-inject-token"
