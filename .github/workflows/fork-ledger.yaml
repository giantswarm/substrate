# Fork (giantswarm/substrate): every pull request against a line names its
# own number in the ledger (FORK.md, fork/), or carries the label no-ledger with a
# "no-ledger: <reason>" line in its description; on every line, every pull
# request merged into it is in the ledger. A workflow
# of its own beside pr-workflow, so a label or a description edit re-runs
# this check alone, not the suites. A re-pin candidate (sync/**, FORK.md,
# "Re-pin") is a rebased branch whose pull request runs no pull_request
# workflow, and the line's ruleset requires this check on the head the landing
# pushes: the push of the candidate reports it, with no row to check, as a
# candidate is closed by its landing, never merged. The job also keeps the
# ledger citing public repositories only: this repository is public.
name: fork-ledger
on:
  push:
    branches: ["sync/**"]
  pull_request:
    branches: [giantswarm, "release-*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fork-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.base_ref }}
      FIELDS: number,title,body,labels,files,headRefName,author
    steps:
      # The merge of the pull request into its line: FORK.md as it would land.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # HEAD^1 of the merge is the line: the lines a pull request adds.
          fetch-depth: 2
      - name: Fixture runs of the check
        run: |
          .github/scripts/fork-ledger-test.sh
          .github/scripts/fork-public-links-test.sh
      # The line publishes from CircleCI to gsoci only; a re-pin replays
      # upstream's workflow files, which publish to GitHub's container
      # registry. The bracket keeps this file out of its own match.
      - name: No workflow publishes to GitHub's container registry
        run: |
          if grep -n 'ghcr[.]io' .github/workflows/*; then
            echo "::error::a workflow names GitHub's container registry; the line publishes from CircleCI to gsoci only (FORK.md, Publishing): remove it"
            exit 1
          fi
      # A pull request is checked on the lines it adds, a push on the whole
      # ledger.
      - name: The ledger cites public repositories only
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            git diff --unified=0 HEAD^1 HEAD -- FORK.md fork | sed -n '/^+++ /d; s/^+//p'
          else
            git ls-files -z FORK.md fork | xargs -0 cat
          fi | .github/scripts/fork-public-links.sh
      - name: This pull request's row
        if: github.event_name == 'pull_request'
        run: |
          gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json "${FIELDS}" >"${RUNNER_TEMP}/pr.json"
          .github/scripts/fork-ledger.sh pr "${RUNNER_TEMP}/pr.json" FORK.md fork
      - name: Every merged pull request's row
        if: github.event_name == 'pull_request'
        run: |
          gh pr list --repo "${GITHUB_REPOSITORY}" --base "${BASE}" --state merged --limit 1000 \
            --json "${FIELDS}" >"${RUNNER_TEMP}/merged.json"
          .github/scripts/fork-ledger.sh line "${RUNNER_TEMP}/merged.json" FORK.md fork
