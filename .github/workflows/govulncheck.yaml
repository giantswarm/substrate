name: govulncheck
on:
  push:
    branches:
      - giantswarm
      # the re-pin candidates (FORK.md, "Re-pin"), which no pull request can run
      - "sync/**"
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  module:
    name: govulncheck (${{ matrix.work-dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The root module, then each module kept apart from it.
        work-dir:
          - .
          - internal/plugins/gcp-secret-manager
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          work-dir: ${{ matrix.work-dir }}

  # Fork (giantswarm/substrate): the line's rulesets and the land step of
  # sync-upstream.yaml require a status named govulncheck, which a matrix job
  # never reports.
  govulncheck:
    needs: module
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.module.result }}
        run: |
          echo "govulncheck over every module: ${RESULT}"
          test "${RESULT}" = success
