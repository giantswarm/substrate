suite: pod certificate lifetime
templates:
- ate-api-server.yaml
- ate-controller.yaml
- atenet-egress.yaml
- atenet-router.yaml
- atelet.yaml
- postgres.yaml
tests:
- it: requests the Deployment pod certificates with kubelet's default lifetime by default
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: ate-api-server.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: ate-api-server.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: ate-controller.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: atenet-egress.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: atenet-egress.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: atenet-router.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: atenet-router.yaml
- it: caps the Deployment pod certificates at the configured lifetime
  set:
    podCertificates.maxExpirationSeconds: 3600
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: ate-api-server.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: ate-api-server.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: ate-controller.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: atenet-egress.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: atenet-egress.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: atenet-router.yaml
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: atenet-router.yaml
- it: requests the DaemonSet pod certificates with kubelet's default lifetime by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: atelet.yaml
- it: caps the DaemonSet pod certificates at the configured lifetime
  set:
    podCertificates.maxExpirationSeconds: 3600
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: atelet.yaml
- it: requests the StatefulSet pod certificates with kubelet's default lifetime by default
  documentSelector:
    path: kind
    value: StatefulSet
  asserts:
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
    template: postgres.yaml
- it: caps the StatefulSet pod certificates at the configured lifetime
  set:
    podCertificates.maxExpirationSeconds: 3600
  documentSelector:
    path: kind
    value: StatefulSet
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600
    template: postgres.yaml
