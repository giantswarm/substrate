suite: pod certificate lifetime
templates:
- ate-api-server.yaml
- ate-controller.yaml
- atelet.yaml
- atenet-router.yaml
tests:
- it: leaves kubelet's default lifetime when unset
  template: ate-controller.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds

- it: caps the controller's certificate
  template: ate-controller.yaml
  set:
    podCertificates.maxExpirationSeconds: 3600
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600

- it: caps atelet's certificate
  template: atelet.yaml
  set:
    podCertificates.maxExpirationSeconds: 3600
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 3600

- it: caps both router certificates
  template: atenet-router.yaml
  set:
    podCertificates.maxExpirationSeconds: 7200
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "podidentity")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 7200
  - equal:
      path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.maxExpirationSeconds
      value: 7200
