suite: egress gateway resources
templates:
- atenet-egress.yaml
tests:
- it: bounds the gateway's ephemeral storage by default
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
      value: 16Mi
  - equal:
      path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
      value: 256Mi
