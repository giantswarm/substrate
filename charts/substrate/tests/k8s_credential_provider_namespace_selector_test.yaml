suite: credential provider namespace selectors
templates:
- k8s-credential-provider.yaml
tests:
- it: reads no namespaces without a namespace selector
  set:
    credentialProvider.namespacePolicies:
    - atespace: team-a
      allowedNamespaces: [team-a-secrets]
  asserts:
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      name: RELEASE-NAME-k8s-credential-provider-namespace-reader
      any: true
    not: true

- it: lists and watches namespaces for an ownNamespaceSelector
  set:
    credentialProvider.namespacePolicies:
    - ownNamespaceSelector:
        matchExpressions:
        - {key: example.com/tenant, operator: Exists}
  documentSelector:
    path: rules[0].resources[0]
    value: namespaces
  asserts:
  - equal:
      path: metadata.name
      value: RELEASE-NAME-k8s-credential-provider-namespace-reader
  - equal:
      path: rules[0].verbs
      value: ["list", "watch"]

- it: lists and watches namespaces for an allowedNamespaceSelector
  set:
    credentialProvider.namespacePolicies:
    - atespace: shared-agents
      allowedNamespaceSelector:
        matchLabels:
          example.com/tenant: "true"
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: RELEASE-NAME-k8s-credential-provider-namespace-reader
      any: true
