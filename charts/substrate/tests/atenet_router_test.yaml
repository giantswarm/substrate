suite: atenet router request parking
templates:
- atenet-router.yaml
tests:
- it: parks a request for a cold restore by default, on every actor route
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: "requestParking:\\n\\s+budget: 30s\\n\\s+max: 1024\\n\\s+retryFactor: 1.1\\n\\s+retryInterval: 100ms"
  - matchRegex:
      path: data["config.yaml"]
      pattern: "(?s)(requestParking:.*){4}"

- it: renders the configured parking budget
  set:
    atenetRouter.requestParking.budget: 2m
    atenetRouter.requestParking.max: 0
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: "budget: 2m\\n\\s+max: 0\\n"
  - notMatchRegex:
      path: data["config.yaml"]
      pattern: "budget: 30s"
