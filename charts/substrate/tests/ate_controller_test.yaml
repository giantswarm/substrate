suite: ate-controller gVisor worker image
templates:
- ate-controller.yaml
tests:
- it: runs gVisor pools on this release's ateom-gvisor by default
  set:
    image.registry: registry.example
    image.repository: giantswarm/substrate
    image.tag: 1.3.1
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --gvisor-worker-image=registry.example/giantswarm/substrate/ateom-gvisor:1.3.1

- it: follows the chart's appVersion and the mirror like the other components
  chart:
    appVersion: 1.4.0
  set:
    global.imageRegistry: mirror.example
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --gvisor-worker-image=mirror.example/kagent-dev/substrate/ateom-gvisor:1.4.0

- it: leaves each pool on its own workerImage when off
  set:
    ateController.gvisorWorker.followRelease: false
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - lengthEqual:
      path: spec.template.spec.containers[0].args
      count: 5
