suite: atenet egress ephemeral storage
templates:
- atenet-egress.yaml
tests:
- it: bounds the ephemeral storage of both containers and the drain-signal emptyDir by default
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.spec.containers[0].name
      value: agentgateway
  - equal:
      path: spec.template.spec.containers[0].resources
      value:
        requests:
          ephemeral-storage: 16Mi
        limits:
          ephemeral-storage: 256Mi
  - equal:
      path: spec.template.spec.containers[1].name
      value: ext-proc
  - equal:
      path: spec.template.spec.containers[1].resources
      value:
        requests:
          ephemeral-storage: 16Mi
        limits:
          ephemeral-storage: 256Mi
  - contains:
      path: spec.template.spec.volumes
      content:
        name: drain-signal
        emptyDir:
          sizeLimit: 16Mi

- it: forwards an operator's resources, merged over the defaults
  set:
    atenetEgress.resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 32Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi
    atenetEgress.extProc.resources.requests.cpu: 50m
    atenetEgress.drainSignal.sizeLimit: 1Mi
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources
      value:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 32Mi
        limits:
          memory: 512Mi
          ephemeral-storage: 1Gi
  - equal:
      path: spec.template.spec.containers[1].resources
      value:
        requests:
          cpu: 50m
          ephemeral-storage: 16Mi
        limits:
          ephemeral-storage: 256Mi
  - contains:
      path: spec.template.spec.volumes
      content:
        name: drain-signal
        emptyDir:
          sizeLimit: 1Mi

- it: renders no resources and an unbounded emptyDir when the three knobs are null
  set:
    atenetEgress.resources: null
    atenetEgress.extProc.resources: null
    atenetEgress.drainSignal.sizeLimit: null
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notExists:
      path: spec.template.spec.containers[0].resources
  - notExists:
      path: spec.template.spec.containers[1].resources
  - contains:
      path: spec.template.spec.volumes
      content:
        name: drain-signal
        emptyDir: {}
