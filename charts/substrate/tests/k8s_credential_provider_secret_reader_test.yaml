suite: credential provider Secret reader binding
templates:
- k8s-credential-provider.yaml
tests:
- it: binds the Secret reader cluster-wide by default
  release:
    name: substrate
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      any: true
    not: true

- it: binds the Secret reader in each listed namespace only
  release:
    name: substrate
    namespace: ate-system
  set:
    credentialProvider.rbac.namespaces: [team-a, team-b, team-a]
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true
    not: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      namespace: team-a
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      namespace: team-b
      any: true
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true

- it: binds the listed RoleBindings to the provider's ServiceAccount
  release:
    name: substrate
    namespace: ate-system
  set:
    credentialProvider.rbac.namespaces: [team-a]
  documentSelector:
    path: kind
    value: RoleBinding
  asserts:
  - equal:
      path: subjects
      value:
      - kind: ServiceAccount
        name: k8s-credential-provider
        namespace: ate-system
  - equal:
      path: roleRef.name
      value: k8s-credential-provider-secret-reader
