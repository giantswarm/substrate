suite: bundled RustFS
templates:
- rustfs.yaml
tests:
- it: names the registry of the RustFS image
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].image
      pattern: '^docker\.io/rustfs/rustfs:'
- it: names the registry of the bucket-init image
  documentSelector:
    path: kind
    value: Job
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].image
      pattern: '^docker\.io/amazon/aws-cli:'
- it: keeps the repository path under a mirror
  documentSelector:
    path: kind
    value: Deployment
  set:
    global:
      imageRegistry: mirror.example.com
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].image
      pattern: '^mirror\.example\.com/rustfs/rustfs:'
- it: stops the old pod before it starts the new one
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
