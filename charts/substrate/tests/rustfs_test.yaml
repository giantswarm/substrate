# The bundled RustFS runs one replica on a ReadWriteOnce claim, so a rolling
# update's new pod could never attach the volume while the old pod holds it:
# the Deployment stops the old pod first (no surge, one unavailable), as a
# rolling update an existing Deployment can be upgraded to in place.
suite: bundled RustFS rollout
templates:
- rustfs.yaml
tests:
- it: stops the old pod before it starts the new one
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.strategy.type
      value: RollingUpdate
  - equal:
      path: spec.strategy.rollingUpdate.maxSurge
      value: 0
  - equal:
      path: spec.strategy.rollingUpdate.maxUnavailable
      value: 1
  - equal:
      path: spec.replicas
      value: 1
  - matchRegex:
      path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
      pattern: rustfs-data$

- it: keeps its data on a ReadWriteOnce claim
  documentSelector:
    path: kind
    value: PersistentVolumeClaim
  asserts:
  - contains:
      path: spec.accessModes
      content: ReadWriteOnce

- it: renders nothing when the bundled store is off
  set:
    rustfs.enabled: false
  asserts:
  - hasDocuments:
      count: 0
