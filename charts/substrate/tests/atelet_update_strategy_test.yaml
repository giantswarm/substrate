suite: atelet rolling update
templates:
- atelet.yaml
tests:
- it: rolls a quarter of the nodes at a time by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.updateStrategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%

- it: renders the configured strategy verbatim
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 3
  asserts:
  - equal:
      path: spec.updateStrategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 3

- it: renders an OnDelete strategy
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      updateStrategy:
        type: OnDelete
        rollingUpdate: null
  asserts:
  - equal:
      path: spec.updateStrategy
      value:
        type: OnDelete

- it: keeps an explicit zero surge
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      updateStrategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 50%
  asserts:
  - equal:
      path: spec.updateStrategy.rollingUpdate
      value:
        maxSurge: 0
        maxUnavailable: 50%

- it: refuses a surge, which atelet's host ports cannot carry
  set:
    atelet:
      updateStrategy:
        rollingUpdate:
          maxSurge: 1
  asserts:
  - failedTemplate:
      errorPattern: "maxSurge must stay 0"
