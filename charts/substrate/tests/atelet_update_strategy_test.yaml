suite: atelet update strategy
templates:
- atelet.yaml
tests:
- it: rolls a quarter of the nodes at a time by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.updateStrategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%

- it: renders a configured strategy as is
  set:
    atelet.updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.updateStrategy.rollingUpdate.maxUnavailable
      value: 1

- it: refuses a surge
  set:
    atelet.updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  asserts:
  - failedTemplate:
      errorPattern: maxSurge must stay 0
