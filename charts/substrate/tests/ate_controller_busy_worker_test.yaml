suite: ate-controller busy worker marking
templates:
- ate-controller.yaml
tests:
- it: does not mark workers by default
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-sync-period=5s

- it: passes the annotations and the period
  set:
    ateController.busyWorker.annotations:
      karpenter.sh/do-not-disrupt: "true"
      example.com/busy: "yes"
    ateController.busyWorker.syncPeriod: 10s
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-annotations=example.com/busy=yes,karpenter.sh/do-not-disrupt=true
  - contains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-sync-period=10s
