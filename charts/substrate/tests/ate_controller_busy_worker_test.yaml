suite: ate-controller busy worker marking
templates:
- ate-controller.yaml
tests:
- it: marks no worker by default
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-sync-period=5s

- it: passes the annotations sorted, with the sync period
  set:
    ateController.busyWorker.annotations:
      karpenter.sh/do-not-disrupt: "true"
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    ateController.busyWorker.syncPeriod: 10s
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-annotations=cluster-autoscaler.kubernetes.io/safe-to-evict=false,karpenter.sh/do-not-disrupt=true
  - contains:
      path: spec.template.spec.containers[0].args
      content: --busy-worker-sync-period=10s
