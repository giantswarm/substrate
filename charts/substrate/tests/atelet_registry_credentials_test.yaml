suite: atelet registry credential Secrets
templates:
- atelet.yaml
tests:
- it: mounts no registry credentials by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notContains:
      path: spec.template.spec.volumes
      content:
        name: registry-credentials-0
      any: true

- it: passes each Secret's file in order and mounts it read-only
  set:
    atelet.registryCredentialSecrets:
    - name: registry-a
    - name: registry-b
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-pull-secret-file=/run/registry-credentials/registry-a/.dockerconfigjson
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-pull-secret-file=/run/registry-credentials/registry-b/.dockerconfigjson
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: registry-credentials-1
        mountPath: /run/registry-credentials/registry-b
        readOnly: true
  - contains:
      path: spec.template.spec.volumes
      content:
        name: registry-credentials-0
        secret:
          secretName: registry-a
          items:
          - key: .dockerconfigjson
            path: .dockerconfigjson

- it: refuses an entry without a name
  set:
    atelet.registryCredentialSecrets:
    - other: x
  asserts:
  - failedTemplate:
      errorPattern: atelet.registryCredentialSecrets entries need a name
