suite: ate-api-server service account and environment
templates:
- ate-api-server.yaml
tests:
- it: renders the ServiceAccount without annotations by default
  documentSelector:
    path: kind
    value: ServiceAccount
  asserts:
  - notExists:
      path: metadata.annotations

- it: renders the configured ServiceAccount annotations
  documentSelector:
    path: kind
    value: ServiceAccount
  set:
    ateApiServer:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/substrate-snapshots
  asserts:
  - equal:
      path: metadata.annotations
      value:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/substrate-snapshots

- it: appends extraEnv to the ate-api-server container
  documentSelector:
    path: kind
    value: Deployment
  set:
    rustfs:
      enabled: false
    ateApiServer:
      extraEnv:
      - name: AWS_REGION
        value: eu-central-1
      - name: AWS_ENDPOINT_URL
        value: https://s3.eu-central-1.amazonaws.com
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: AWS_REGION
        value: eu-central-1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: AWS_ENDPOINT_URL
        value: https://s3.eu-central-1.amazonaws.com
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: AWS_ACCESS_KEY_ID
      any: true

- it: lets ate-api-server read Nodes, to tell a node that left the cluster from one whose workers are momentarily absent
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "watch", "list"]
