suite: k8s credential provider OpenTelemetry
templates:
- k8s-credential-provider.yaml
tests:
- it: gives the provider the otel settings of the other Go components
  set:
    otel.endpoint: http://collector.example:4317
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://collector.example:4317
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_RESOURCE_ATTRIBUTES
        value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)

- it: turns each disabled signal off, where the SDK would export to localhost:4317
  set:
    otel.traces.enabled: false
    otel.metrics.enabled: false
    otel.logs.enabled: false
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_TRACES_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_METRICS_EXPORTER
        value: none
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""

- it: exports nothing with the default values, where no endpoint is set
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_TRACES_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_METRICS_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_LOGS_EXPORTER
        value: none

- it: exports a signal that has its own endpoint and turns the others off
  set:
    otel.metrics.endpoint: http://collector.example:4317
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
        value: http://collector.example:4317
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_METRICS_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_TRACES_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_LOGS_EXPORTER
        value: none

- it: exports every signal through the shared endpoint
  set:
    otel.endpoint: http://collector.example:4317
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_TRACES_EXPORTER
        value: none
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_METRICS_EXPORTER
        value: none
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_LOGS_EXPORTER
        value: otlp
