suite: credential provider telemetry
templates:
- k8s-credential-provider.yaml
tests:
- it: exports to the chart's OTLP endpoint
  set:
    otel.endpoint: http://collector:4317
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://collector:4317
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_RESOURCE_ATTRIBUTES
        value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)

- it: turns metrics export off with the chart
  set:
    otel.metrics.enabled: false
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_METRICS_EXPORTER
        value: none
