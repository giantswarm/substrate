suite: podcertificate-controller namespace
templates:
- pod-certificate-controller.yaml
tests:
- it: keeps the namespace, and the CA pools provisioned into it, across an uninstall
  documentSelector:
    path: kind
    value: Namespace
  asserts:
  - equal:
      path: metadata.name
      value: podcertificate-controller-system
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep

- it: mounts the two CA pools from that namespace
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: metadata.namespace
      value: podcertificate-controller-system
  - equal:
      path: spec.template.spec.volumes[0].projected.sources[0].secret.name
      value: service-dns-ca-pool
  - equal:
      path: spec.template.spec.volumes[0].projected.sources[1].secret.name
      value: pod-identity-ca-pool
