suite: podLabels
templates:
- ate-api-server.yaml
- ate-controller.yaml
- atelet.yaml
- rustfs.yaml
tests:
- it: adds podLabels next to the app label of each long-running pod
  set:
    podLabels:
      example.com/tenant: platform
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
    skipEmptyTemplates: true
  asserts:
  - equal:
      path: spec.template.metadata.labels["example.com/tenant"]
      value: platform
  - exists:
      path: spec.template.metadata.labels.app

- it: adds podLabels to the atelet DaemonSet
  template: atelet.yaml
  set:
    podLabels:
      example.com/tenant: platform
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.metadata.labels
      value:
        app: atelet
        example.com/tenant: platform

- it: leaves the bucket-init Job without podLabels
  template: rustfs.yaml
  set:
    podLabels:
      example.com/tenant: platform
  documentSelector:
    path: kind
    value: Job
  asserts:
  - notExists:
      path: spec.template.metadata.labels["example.com/tenant"]

- it: refuses to replace the app label
  template: rustfs.yaml
  set:
    podLabels:
      app: other
  asserts:
  - failedTemplate:
      errorPattern: podLabels must not set app
