suite: atelet scheduling
templates:
- atelet.yaml
tests:
- it: schedules atelet on every node by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.nodeSelector
  - notExists:
      path: spec.template.spec.tolerations
  - notExists:
      path: spec.template.spec.affinity

- it: renders the configured nodeSelector and tolerations
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
      - key: dedicated
        operator: Equal
        value: sandboxes
        effect: NoSchedule
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value:
        node-role.kubernetes.io/worker: ""
  - equal:
      path: spec.template.spec.tolerations
      value:
      - key: dedicated
        operator: Equal
        value: sandboxes
        effect: NoSchedule
  - notExists:
      path: spec.template.spec.affinity

- it: renders the configured affinity
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
  asserts:
  - equal:
      path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
      value:
        key: kubernetes.io/arch
        operator: In
        values: [amd64]

- it: mounts the kubelet plugins directory with HostToContainer propagation
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[?(@.name == "atelet")].volumeMounts
      content:
        name: kubelet-plugins
        mountPath: /var/lib/kubelet/plugins
        mountPropagation: HostToContainer

- it: lets atelet preempt lower-priority pods by default
  documentSelector:
    path: kind
    value: PriorityClass
  asserts:
  - equal:
      path: preemptionPolicy
      value: PreemptLowerPriority
  - matchRegex:
      path: metadata.name
      pattern: -ate-node-critical$

- it: renders a non-preempting class of its own name when preemption is off
  set:
    atelet:
      priorityClass:
        preemptionPolicy: Never
  asserts:
  - equal:
      path: preemptionPolicy
      value: Never
    documentSelector:
      path: kind
      value: PriorityClass
  - matchRegex:
      path: metadata.name
      pattern: -ate-node-critical-non-preempting$
    documentSelector:
      path: kind
      value: PriorityClass
  - matchRegex:
      path: spec.template.spec.priorityClassName
      pattern: -ate-node-critical-non-preempting$
    documentSelector:
      path: kind
      value: DaemonSet

- it: refuses an unknown preemption policy
  set:
    atelet:
      priorityClass:
        preemptionPolicy: Sometimes
  asserts:
  - failedTemplate:
      errorPattern: "must be PreemptLowerPriority or Never"
