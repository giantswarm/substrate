suite: atelet scheduling
templates:
- atelet.yaml
tests:
- it: schedules atelet on every node by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.nodeSelector
  - notExists:
      path: spec.template.spec.tolerations
  - notExists:
      path: spec.template.spec.affinity

- it: renders the configured nodeSelector and tolerations
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
      - key: dedicated
        operator: Equal
        value: sandboxes
        effect: NoSchedule
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value:
        node-role.kubernetes.io/worker: ""
  - equal:
      path: spec.template.spec.tolerations
      value:
      - key: dedicated
        operator: Equal
        value: sandboxes
        effect: NoSchedule
  - notExists:
      path: spec.template.spec.affinity

- it: renders the configured affinity
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
  asserts:
  - equal:
      path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0]
      value:
        key: kubernetes.io/arch
        operator: In
        values: [amd64]
