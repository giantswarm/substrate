# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class, shipped with
# the platform so gVisor ActorTemplates have a config to name via
# sandboxConfig.configName.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
spec:
  sandboxClass: gvisor
  pauseImage: {{ required "images.pause: the sandbox's root container image, by digest" .Values.images.pause | quote }}
  assets:
    amd64:
      gvisor:
        url: "gs://gvisor/releases/nightly/2026-09-09/x86_64/gvisor.tar.zstd"
        sha256: "fa96cce976ceecb0c4a867dfba9317b30129239ea9a16aec0050fbacb6a6b5af"
    arm64:
      gvisor:
        url: "gs://gvisor/releases/nightly/2026-09-09/aarch64/gvisor.tar.zstd"
        sha256: "4fc4d64dc5722201008eafb7b02d8f2ac2f7f0d79c912352c6fab8ddb08956d4"
