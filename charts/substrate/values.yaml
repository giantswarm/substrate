# Default values for the substrate chart.
#
# The chart requires ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest, and the certificates.k8s.io/v1beta1 API.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

postgres:
  enabled: true
  storageSize: 1Gi
  connectionString: ""
  # Read the connection string from a Secret instead of values/ConfigMap.
  connectionStringSecretRef:
    # When enabled with no name, use the release-scoped postgres-connection name.
    enabled: false
    name: ""
    key: connectionString
  schema: public
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  gcpAuthForImagePulls: false
  storageBackend: s3
  extraArgs: []
  extraEnv: []
  # Annotations on atelet's ServiceAccount: the pod identity an external
  # object store trusts for the snapshots (eks.amazonaws.com/role-arn for
  # IRSA, iam.gke.io/gcp-service-account for Workload Identity).
  serviceAccount:
    annotations: {}
  # Where atelet runs: the DaemonSet's nodeSelector, tolerations and affinity.
  # Empty = every schedulable node.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # atelet's node-local image cache: the eviction pass and what it keeps.
  # null leaves atelet's built-in default: a pass every 5m that evicts,
  # least recently used first, while the cache volume is above 85 % until
  # it is below 80 %, never a layer younger than 2m, no absolute cap.
  imageCache:
    gcPeriod: null # --image-cache-gc-period, e.g. 5m; 0 disables the pass
    highPercent: null # --image-cache-high-percent
    lowPercent: null # --image-cache-low-percent
    minAge: null # --image-cache-min-age, e.g. 2m
    maxBytes: null # --image-cache-max-bytes
    # Image references pulled at every pass and never evicted: the images
    # of the pool's ActorTemplates, on nodes whose cache volume sits above
    # the watermark, so the first actor after an idle spell does not pay a
    # cold pull and unpack.
    pinnedImages: []

atenetRouter:
  # Request parking on the actor routes (agentgateway's substrateIngress
  # requestParking): a request to a suspended actor is held while the actor
  # resumes, for at most `budget`. The budget has to cover a cold restore --
  # the image pull and unpack when the node's cache does not hold the actor's
  # image, seconds on a warm disk and longer on a slow one -- or the request
  # fails at the budget, and the restore it started is repeated from scratch by
  # the next one. `max` bounds how many requests may wait at once; 0 disables
  # parking.
  requestParking:
    budget: 30s
    max: 1024
    retryInterval: 100ms
    retryFactor: 1.1

# ate-api-server deployment overrides. Its snapshot-store client reaches the
# same object store as atelet's: the ServiceAccount annotations carry the pod
# identity the store trusts (see atelet.serviceAccount.annotations), extraEnv
# the store's endpoint and options (an S3-compatible endpoint's AWS_ENDPOINT_URL,
# AWS_REGION, ...). extraEnv is appended verbatim to the container's env, the
# counterpart of atelet.extraEnv.
ateApiServer:
  serviceAccount:
    annotations: {}
  extraEnv: []

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# OTLP export, following the OpenTelemetry SDK environment variable spec.
# endpoint applies to every signal; a signal's own endpoint overrides it.
# A signal exports only when it is enabled and resolves to an endpoint.
#
# traces.enabled and metrics.enabled set OTEL_<SIGNAL>_EXPORTER=none on the
# Go components, which do not read it yet and keep exporting; the setting
# takes effect on the router's agentgateway only. logs.enabled works in full,
# since the agentgateway access log is the only OTLP log source.
otel:
  endpoint: ""
  traces:
    enabled: true
    endpoint: ""
    samplingRatio: 0.01
  metrics:
    enabled: true
    endpoint: ""
  logs:
    enabled: true
    endpoint: ""

image:
  registry: ghcr.io/kagent-dev/substrate
  tag: ""

images:
  postgres: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  rustfs: rustfs/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
  awsCli: amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
  # The agentgateway build atenet-router and atenet-egress run: a release of the
  # Giant Swarm line of agentgateway. Its egress config (atenet-egress.yaml) is
  # written for this build's config schema, so the two move together; the
  # publish workflow stamps AGENTGATEWAY_IMAGE here and refuses a drift.
  agentgateway: ghcr.io/giantswarm/agentgateway-upstream/agentgateway:v1.5.1-gs.4
  busybox: busybox:1.36
