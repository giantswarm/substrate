# Default values for the substrate chart.
#
# The chart requires ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest, and the certificates.k8s.io/v1beta1 API.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

# Preview gates for the API server, controller (including its workers), and atelet.
# ExternalVolumes is required for external volume APIs and mounts.
preview: []

# Caps the lifetime kubelet requests for every pod certificate the chart
# projects (3600 to 7862400 seconds). null keeps kubelet's default of 86400.
# The signers issue at most 24 hours.
podCertificates:
  maxExpirationSeconds: null

postgres:
  # Project database login certificates only when the connection strings use them.
  clientCertificates:
    enabled: false
  # Read the read/write connection string from a pre-created Secret.
  readWriteConnectionStringSecretRef:
    name: substrate-postgres-readwrite
    key: readWriteConnectionString
  # Read the owner connection string from a pre-created Secret.
  ownerConnectionStringSecretRef:
    name: substrate-postgres-owner
    key: ownerConnectionString
  # Roles assumed on each connection. Use distinct roles for installs sharing a database.
  readWriteRole: substrate_readwrite
  ownerRole: substrate_owner
  schema: substrate

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # The Job that creates the snapshot bucket.
  bucketInit:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  # Deprecated, and to be removed in the future: one upgrade of this release moves
  # atelet and ate-api-server together, which the version skew policy does not
  # allow. New installs should set false and install the substrate-atelet
  # chart. See charts/substrate-atelet/README.md.
  enabled: true
  # Host paths for the node's kubelet credential provider. Set both to enable
  # private registry authentication (GKE: /etc/srv/kubernetes/cri_auth_config.yaml
  # and /home/kubernetes/bin). Leave empty on nodes without a provider, like Kind.
  imageCredentialProviderConfig: ""
  # The config itself, rendered into a ConfigMap, for nodes whose image owns
  # the kubelet's copy (EKS) and for a provider environment that has to differ
  # from the kubelet's. Set this or imageCredentialProviderConfig, not both;
  # either one still needs the bin directory.
  imageCredentialProviderConfigYAML: ""
  imageCredentialProviderBinDir: ""
  # kubernetes.io/dockerconfigjson Secrets in the release namespace whose
  # credentials atelet pulls actor images with, tried before the credential
  # provider's: [{name: my-registry}]. Each is mounted read-only, so a rotated
  # Secret takes effect without a restart. imagePullSecrets, by contrast, pull
  # the chart's own pods.
  registryCredentialSecrets: []
  storageBackend: s3
  extraArgs: []
  extraEnv: []
  # Annotations on atelet's ServiceAccount, such as the pod identity an
  # external object store trusts (eks.amazonaws.com/role-arn for IRSA,
  # iam.gke.io/gcp-service-account for Workload Identity).
  serviceAccount:
    annotations: {}
  # PriorityClass of the atelet pods. Every actor on a node depends on its
  # atelet. The chart's ResourceQuota admits system-node-critical and
  # system-cluster-critical pods on clusters that restrict those classes to
  # kube-system.
  priorityClassName: system-cluster-critical
  imageCache:
    # Image references atelet pulls at every eviction pass and never evicts,
    # such as the images of a pool's ActorTemplates. The first actor after an
    # idle spell then skips a cold pull. atelet reads the list from a mounted
    # ConfigMap, so a change restarts no atelet pod.
    pinnedImages: []
  # The DaemonSet's update strategy, rendered as is. A node's atelet is away
  # for a few seconds while its actors keep running, so rolling a quarter of
  # the nodes at a time shortens the roll without a deeper outage per node.
  # maxSurge must stay 0: two atelets cannot share a node.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  # Where atelet runs: the DaemonSet's nodeSelector and affinity, and
  # tolerations added to the chart's fixed ones. Empty runs atelet on every
  # schedulable node.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# Object storage credentials/settings for snapshot transfers and private sandbox assets.
objectStorePlugin:
  # Required for GCS: the Google service account the exchange impersonates
  # for actor-scoped snapshot transfers. Unused by S3/RustFS.
  transferServiceAccount: ""
  extraEnv: []
  control:
    resources: {}
  node:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# Additional arguments appended to the ateapi defaults.
ateApi:
  # Cluster-wide snapshot URI. Empty uses gs://<rustfs.bucket>/ when RustFS is
  # enabled (the S3 backend also uses gs:// URIs). Required for external storage
  # unless the PerTemplateSnapshotLocation preview gate is enabled.
  snapshotLocation: ""
  logLevel: info
  authorization:
    # Empty defaults to the release's shared ate-client principal. Use explicit
    # operator principals for shared installs; see docs/guides/authorization.md.
    bootstrapOwners: []
  # Defaults to the in-cluster IdP URL; set a stable issuer for external consumers.
  actorJWTIssuer: ""
  extraArgs: []
  # Appended to the ate-api-server container's env.
  extraEnv: []
  # Annotations on ate-api-server's ServiceAccount, such as the pod identity
  # an external object store trusts (see atelet.serviceAccount.annotations).
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

ateIdpServer:
  resources: {}

ateController:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  busyWorker:
    # Annotations ate-controller sets on a worker pod while it hosts at least
    # one Actor, and removes once it hosts none. The pod also carries the label
    # ate.dev/busy=true while marked. On a Karpenter cluster,
    # {karpenter.sh/do-not-disrupt: "true"} keeps disruption off a node while a
    # worker on it is busy. Empty disables the marking.
    annotations: {}
    # How often the marking follows the registry: the longest an Actor runs on
    # an unmarked worker.
    syncPeriod: 5s

atenetRouter:
  requestParking:
    # Maximum time to wait for a suspended actor to become routable.
    budget: "60s"
  # Timeout for each Substrate ingress API call, including actor resolution.
  requestTimeout: "60s"
  # mTLS client identities allowed to reach actors. Empty denies all ingress.
  ingressAllowedSPIFFEIDs: []
  agentgateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 1Gi

atenetEgress:
  # Credential providers you deploy, added after the bundled k8s.io provider
  # when credentialProvider.enabled. name is the host of the ate-secret:// URIs
  # the provider serves, and address is the host:port the gateway dials over
  # mTLS. The provider's serving certificate must chain to the servicedns CA
  # and name the address host.
  extraCredentialProviders: []
  # - name: vault.example.com
  #   address: vault-provider.vault.svc:50051
  agentgateway:
    logLevel: info
    # The gateway writes nothing but its logs, so its ephemeral storage is
    # bounded too.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: "2"
        memory: 1Gi
        ephemeral-storage: 256Mi

# Kubernetes Secret provider and AGW HTTP/HTTPS credential injection.
# Includes get-only Secret RBAC. HTTPS requires egress-mitm-ca-pool and actor trust.
credentialProvider:
  # Deploy the Kubernetes Secret provider and route k8s.io credential URIs to it.
  enabled: true
  rbac:
    # Namespaces the provider reads Secrets in. Empty binds its Secret reader
    # ClusterRole cluster-wide. Set, the ClusterRole is bound by RoleBinding in
    # each listed namespace only, and a namespace added later needs its own
    # entry.
    namespaces: []
  namespacePolicies: []
  # - atespace: team-a
  #   allowedNamespaces: [team-a-secrets]
  # A policy with an ownNamespaceSelector (a Kubernetes label selector) in
  # place of atespace and allowedNamespaces lets each namespace it matches be
  # read by the atespace of the same name, and by no other; namespaces are
  # matched by their current labels, and the chart adds list/watch RBAC on
  # namespaces for it.
  # - ownNamespaceSelector:
  #     matchExpressions:
  #     - {key: example.com/tenant, operator: Exists}
  # An allowedNamespaceSelector beside atespace grants that atespace every
  # namespace it matches, an explicit opt-in. The chart adds the same RBAC.
  # - atespace: shared-agents
  #   allowedNamespaceSelector:
  #     matchExpressions:
  #     - {key: example.com/tenant, operator: Exists}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Prometheus Operator PodMonitors for the workloads that serve metrics.
# Requires the monitoring.coreos.com/v1 CRDs.
metrics:
  podMonitor:
    enabled: false
    # Scrape interval. Empty uses the Prometheus default.
    interval: ""
    # Labels on every PodMonitor, such as the label a podMonitorSelector
    # matches or a tenant label.
    labels: {}

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# OTLP export, following the OpenTelemetry SDK environment variable spec.
# endpoint applies to every signal; a signal's own endpoint overrides it.
# A signal exports only when it is enabled and resolves to an endpoint.
#
# metrics.enabled disables OTLP metrics push from the Go components and router.
# traces.enabled takes effect on the router; Go components do not read it yet.
# logs.enabled gates OTLP actor events from ateapi and the ateworkers, plus the
# router's access log. Actor events go to stdout when OTLP logs are disabled
# or no endpoint resolves.
otel:
  endpoint: ""
  traces:
    enabled: true
    endpoint: ""
    samplingRatio: 0.01
  metrics:
    enabled: true
    endpoint: ""
  logs:
    enabled: true
    endpoint: ""

# Values under `global` are visible to this chart and to every subchart. A parent
# chart or an operator sets one value here instead of one value per chart.
global:
  # -- Mirror registry that overrides where every image is pulled from. This is
  # the air-gap knob. It wins over image.registry for component images. Each
  # `images.*` reference has its registry segment replaced. Repository paths are
  # preserved, so a mirror only has to copy images under their existing paths.
  # For control without the override, leave this unset and set image.registry.
  imageRegistry: ""
  # -- Pull secrets merged (union) into each pod's own imagePullSecrets list.
  imagePullSecrets: []
  # -- Fallback imagePullPolicy where a container does not set one.
  imagePullPolicy: ""

# Labels added to every long-running pod the chart renders, next to the
# chart's own `app` label, which they cannot replace. The rustfs-bucket-init
# Job does not get them: its pod template is immutable.
podLabels: {}

# Pull secrets for every pod this chart renders. Merged with global.imagePullSecrets.
imagePullSecrets: []

image:
  # Registry host for the component images, and nothing else. To change
  # environments, change only this value or global.imageRegistry, which overrides
  # it. A path inside `registry` fails the render, and the error names this
  # split.
  registry: ghcr.io
  # Image path prefix under the registry, ahead of each component name. The path
  # is identical on every registry that serves the images. A mirror copies the
  # images under this same path.
  repository: kagent-dev/substrate
  tag: ""

# Every reference names its registry. Only containerd resolves a Docker Hub
# short name to docker.io. CRI-O and Podman resolve short names through
# containers-registries.conf(5), and in enforcing short-name mode (CRI-O's
# default) they refuse a name that is not an alias.
images:
  rustfs: docker.io/rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  awsCli: docker.io/amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
  agentgateway: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  busybox: docker.io/library/busybox:1.36
