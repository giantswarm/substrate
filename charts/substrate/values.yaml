# Default values for the substrate chart.
#
# The chart requires ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest, and the certificates.k8s.io/v1beta1 API.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

# Pod certificates: every component authenticates with certificates kubelet
# requests through podCertificate projected-volume sources and the chart's
# signers issue. maxExpirationSeconds caps the lifetime kubelet asks for (the
# signers issue at most 24h; kubelet accepts 3600 to 7862400); unset keeps
# kubelet's default of 86400. A short value exercises certificate rotation on a
# live installation within an hour: kubelet re-requests and rewrites each
# bundle 30 minutes before it expires.
podCertificates:
  maxExpirationSeconds: null

postgres:
  enabled: true
  storageSize: 1Gi
  connectionString: ""
  # Read the connection string from a Secret instead of values/ConfigMap.
  connectionStringSecretRef:
    # When enabled with no name, use the release-scoped postgres-connection name.
    enabled: false
    name: ""
    key: connectionString
  schema: public
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  gcpAuthForImagePulls: false
  storageBackend: s3
  extraArgs: []
  extraEnv: []
  # Annotations on atelet's ServiceAccount: the pod identity an external
  # object store trusts for the snapshots (eks.amazonaws.com/role-arn for
  # IRSA, iam.gke.io/gcp-service-account for Workload Identity).
  serviceAccount:
    annotations: {}
  # Where atelet runs: the DaemonSet's nodeSelector, tolerations and affinity.
  # Empty = every schedulable node.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # atelet's node-local image cache: the eviction pass and what it keeps.
  # null leaves atelet's built-in default: a pass every 5m that evicts,
  # least recently used first, while the cache volume is above 85 % until
  # it is below 80 %, never a layer younger than 2m, no absolute cap.
  imageCache:
    gcPeriod: null # --image-cache-gc-period, e.g. 5m; 0 disables the pass
    highPercent: null # --image-cache-high-percent
    lowPercent: null # --image-cache-low-percent
    minAge: null # --image-cache-min-age, e.g. 2m
    maxBytes: null # --image-cache-max-bytes
    # Image references pulled at every pass and never evicted: the images
    # of the pool's ActorTemplates, on nodes whose cache volume sits above
    # the watermark, so the first actor after an idle spell does not pay a
    # cold pull and unpack.
    pinnedImages: []

# Additional arguments appended to the ateapi defaults.
ateApi:
  extraArgs: []

# Kubernetes Secret provider and AGW HTTP/HTTPS credential injection.
# Includes get-only Secret RBAC. HTTPS requires egress-mitm-ca-pool and actor trust.
credentialProvider:
  namespacePolicies: []
  # - atespace: team-a
  #   allowedNamespaces: [team-a-secrets]

atenetRouter:
  # Request parking on the actor routes (agentgateway's substrateIngress
  # requestParking): a request to a suspended actor is held while the actor
  # resumes, for at most `budget`. The budget has to cover a cold restore --
  # the image pull and unpack when the node's cache does not hold the actor's
  # image, seconds on a warm disk and longer on a slow one -- or the request
  # fails at the budget, and the restore it started is repeated from scratch by
  # the next one. `max` bounds how many requests may wait at once; 0 disables
  # parking.
  requestParking:
    budget: 30s
    max: 1024
    retryInterval: 100ms
    retryFactor: 1.1

# ate-api-server deployment overrides. Its snapshot-store client reaches the
# same object store as atelet's: the ServiceAccount annotations carry the pod
# identity the store trusts (see atelet.serviceAccount.annotations), extraEnv
# the store's endpoint and options (an S3-compatible endpoint's AWS_ENDPOINT_URL,
# AWS_REGION, ...). extraEnv is appended verbatim to the container's env, the
# counterpart of atelet.extraEnv.
ateApiServer:
  serviceAccount:
    annotations: {}
  extraEnv: []

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# Prometheus metrics. Four components serve /metrics on their own pod port:
# ate-api-server, atelet and the atenet router start the metrics server
# themselves and carry the prometheus.io/* annotations, which only a Prometheus
# doing pod-annotation discovery reads; ate-controller serves
# controller-runtime's metrics server on :8080, its default, and carries no
# annotation at all. A Prometheus Operator installation discovers PodMonitors,
# so turn these on there or the metrics are served and never collected.
metrics:
  podMonitor:
    # Requires the monitoring.coreos.com/v1 CRDs. Off by default: the object
    # does not apply on a cluster without the Prometheus Operator.
    enabled: false
    # Scrape interval. Empty leaves Prometheus' own default.
    interval: ""
    # Labels on every PodMonitor. Set whatever the Prometheus' or the agent's
    # podMonitorSelector matches on, and any tenant label a multi-tenant
    # backend routes by.
    labels: {}

# OTLP export, following the OpenTelemetry SDK environment variable spec.
# endpoint applies to every signal; a signal's own endpoint overrides it.
# A signal exports only when it is enabled and resolves to an endpoint.
#
# traces.enabled and metrics.enabled set OTEL_<SIGNAL>_EXPORTER=none on the
# Go components, which do not read it yet and keep exporting; the setting
# takes effect on the router's agentgateway only. logs.enabled works in full,
# and gates both OTLP log sources: ateapi's actor lifecycle events and the
# router's agentgateway access log.
otel:
  endpoint: ""
  traces:
    enabled: true
    endpoint: ""
    samplingRatio: 0.01
  metrics:
    enabled: true
    endpoint: ""
  logs:
    enabled: true
    endpoint: ""

# Values under `global` are visible to this chart and to every subchart. A parent
# chart or an operator sets one value here instead of one value per chart.
global:
  # -- Mirror registry that overrides where every image is pulled from. This is
  # the air-gap knob. It wins over image.registry for component images. Each
  # `images.*` reference has its registry segment replaced. Repository paths are
  # preserved, so a mirror only has to copy images under their existing paths.
  # For control without the override, leave this unset and set image.registry.
  imageRegistry: ""
  # -- Pull secrets merged (union) into each pod's own imagePullSecrets list.
  imagePullSecrets: []
  # -- Fallback imagePullPolicy where a container does not set one.
  imagePullPolicy: ""

# Labels added to every long-running pod the chart renders, next to the chart's
# own `app` label, which they cannot replace. For example the label a
# multi-tenant telemetry collector routes a pod's OTLP export by. The
# rustfs-bucket-init Job does not get them: a Job's pod template is immutable,
# so a change would fail the upgrade.
podLabels: {}

# Pull secrets for every pod this chart renders. Merged with global.imagePullSecrets.
imagePullSecrets: []

image:
  # Registry host for the component images, and nothing else. To change
  # environments, change only this value or global.imageRegistry, which overrides
  # it. A path inside `registry` fails the render, and the error names this
  # split.
  registry: ghcr.io
  # Image path prefix under the registry, ahead of each component name. The path
  # is identical on every registry that serves the images. A mirror copies the
  # images under this same path.
  repository: kagent-dev/substrate
  tag: ""

# Every reference names its registry (awsCli: see below). A Docker Hub short
# name (`postgres:…`, `rustfs/rustfs:…`) is resolved by the node's container
# runtime, and only containerd defaults it to docker.io: CRI-O and Podman
# resolve short names through containers-registries.conf(5) and, with
# short-name mode enforcing (CRI-O's default), refuse a name that is not an
# alias — the pod fails with `ImageInspectError: short name mode is
# enforcing, but image name rustfs/rustfs:… returns ambiguous list`.
#
# The registry is gsoci.azurecr.io, the one every Giant Swarm installation
# pulls from and whose signing identity its image policy trusts: each value
# is upstream's pin — the same tag, the same digest — under its gsoci copy
# (retagger mirrors library/postgres, rustfs/rustfs, library/busybox and the
# agentgateway line's release tags there). Docker Hub's floating `18-alpine`
# is carried by digest, which the mirror publishes under the versioned tag
# it was; a re-pin keeps the digest equal to upstream's.
images:
  postgres: gsoci.azurecr.io/giantswarm/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  rustfs: gsoci.azurecr.io/giantswarm/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
  # Still a short name: this is the image of the rustfs-bucket-init Job, and a
  # Job's pod template is immutable. Any change of this value — this one, or
  # a version bump — fails the upgrade of every existing installation with
  # `Job.batch "rustfs-bucket-init" is invalid: spec.template: … field is
  # immutable` until someone deletes the completed Job by hand. Qualify it
  # together with a change that lets the Job be recreated (a hook Job with
  # before-hook-creation, or a name that carries the template's hash — the
  # platform's network policies select the Job by `job-name`). Its gsoci copy
  # is gsoci.azurecr.io/giantswarm/aws-cli:2.17.0, the same digest.
  awsCli: amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
  # The agentgateway build atenet-router and atenet-egress run: a release of the
  # Giant Swarm line of agentgateway, published by that line from CircleCI to
  # gsoci under its own path and versioned on its own (decoupled from upstream's
  # versions, as this chart's are). Its egress config (atenet-egress.yaml) is
  # written for this build's config schema, so the two move together; the
  # publish pipeline stamps AGENTGATEWAY_IMAGE here and refuses a drift.
  agentgateway: gsoci.azurecr.io/giantswarm/agentgateway-upstream/agentgateway:2.2.1
  # Not rendered by any template of this chart; kept as upstream keeps it.
  busybox: gsoci.azurecr.io/giantswarm/busybox:1.36
