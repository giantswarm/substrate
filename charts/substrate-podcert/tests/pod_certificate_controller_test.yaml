suite: podcertificate-controller namespace
templates:
- pod-certificate-controller.yaml
tests:
- it: renders no namespace by default
  asserts:
  - containsDocument:
      kind: Namespace
      apiVersion: v1
    not: true

- it: keeps the namespace, and the CA pools in it, across an uninstall
  release:
    namespace: podcertificate-controller-system
  set:
    createNamespace: true
  documentSelector:
    path: kind
    value: Namespace
  asserts:
  - equal:
      path: metadata.name
      value: podcertificate-controller-system
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
